[phases.setup]
# The older Nixpacks PHP 8.4 build omits MySQL SHA-2 authentication.
# This snapshot includes the upstream mysqlnd SSL/authentication build fix.
nixpkgsArchive = "efa1a8f4f59ceefb266971ce3f06338283cbdbc7"
cmds = ["mkdir -p /var/log/nginx", "php --ri mysqlnd | grep -q auth_plugin_caching_sha2_password || { echo 'PHP database driver is missing MySQL SHA-2 authentication support'; exit 1; }"]

[variables]
IS_LARAVEL = ""
NIXPACKS_PHP_FALLBACK_PATH = ""
